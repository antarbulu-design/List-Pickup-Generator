<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antarbulu - List Pickup Generator</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --dark: #343a40; --secondary: #6c757d; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f6; overflow: hidden; }
        
        .db-panel { flex: 1; display: flex; flex-direction: column; padding: 20px; border-right: 2px solid #ddd; }
        .db-header { margin-bottom: 15px; }
        .search-container { display: flex; gap: 10px; margin-bottom: 10px; }
        #searchBar { flex-grow: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        .table-container { flex-grow: 1; overflow-y: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--primary); color: white; position: sticky; top: 0; padding: 12px; text-align: left; z-index: 10; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background: #f9f9f9; }


        .pickup-panel { width: 450px; background: white; display: flex; flex-direction: column; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        .list-container { flex-grow: 1; overflow-y: auto; margin: 15px 0; }
        .pickup-card { background: #fff; border: 1px solid #e0e0e0; border-left: 5px solid var(--success); padding: 12px; margin-bottom: 10px; border-radius: 5px; position: relative; font-size: 13px; }
        .pickup-card strong { color: #333; font-size: 15px; }
        .btn-del { position: absolute; top: 10px; right: 10px; color: var(--danger); border: none; background: none; cursor: pointer; font-weight: bold; }


        .btn-add { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-select-all { background: var(--secondary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .btn-copy { background: var(--dark); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
        
        .empty-state { text-align: center; color: #888; margin-top: 50px; font-style: italic; }
        .badge-count { background: var(--success); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>


<div class="db-panel">
    <div class="db-header">
        <h2 style="margin:0 0 10px 0;">📂 Daftar Customer Antar Bulu <span style="font-size: 0.5em; color: #666;"></span></h2>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Cari Nama Customer atau Area..." onkeyup="filterTable()">
            <button class="btn-select-all" onclick="selectAllFiltered()">+ PILIH SEMUA</button>
        </div>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Area</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="dbBody"></tbody>
        </table>
    </div>
</div>


<div class="pickup-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">📋 List Pickup <span id="totalBadge" class="badge-count">0</span></h2>
        <button onclick="clearList()" style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:12px;">Hapus Semua</button>
    </div>
    <div id="listContainer" class="list-container">
        <div class="empty-state">Belum ada customer dipilih.</div>
    </div>
    
    <button class="btn-copy" onclick="copyList()">📋 SALIN LIST KE WHATSAPP</button>
</div>

    let pickupQueue = [];
    let currentFiltered = [...clients];


    function renderDatabase(data) {
        const body = document.getElementById('dbBody');
        body.innerHTML = '';
        data.forEach(client => {
            const row = `<tr>
                <td><strong>${client.name}</strong></td>
                <td>${client.area}</td>
                <td><button class="btn-add" onclick="addToQueue('${client.name}')">+</button></td>
            </tr>`;
            body.innerHTML += row;
        });
    }


    function filterTable() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        currentFiltered = clients.filter(c => 
            c.name.toLowerCase().includes(q) || c.area.toLowerCase().includes(q)
        );
        renderDatabase(currentFiltered);
    }


    function selectAllFiltered() {
        currentFiltered.forEach(item => {
            if(!pickupQueue.some(q => q.name === item.name)) {
                pickupQueue.push(item);
            }
        });
        updatePickupView();
    }


    function clearList() {
        if(confirm("Kosongkan semua list pickup?")) {
            pickupQueue = [];
            updatePickupView();
        }
    }


    function addToQueue(name) {
        const item = clients.find(c => c.name === name);
        if(!pickupQueue.some(q => q.name === name)) {
            pickupQueue.push(item);
            updatePickupView();
        }
    }


    function removeFromQueue(index) {
        pickupQueue.splice(index, 1);
        updatePickupView();
    }


    function updatePickupView() {
        const container = document.getElementById('listContainer');
        const badge = document.getElementById('totalBadge');
        badge.innerText = pickupQueue.length;


        if(pickupQueue.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada customer dipilih.</div>';
            return;
        }


        container.innerHTML = '';
        pickupQueue.forEach((item, index) => {
            container.innerHTML += `
                <div class="pickup-card">
                    <button class="btn-del" onclick="removeFromQueue(${index})">x</button>
                    <strong>${item.name}</strong> (${item.area})<br>
                    <span style="color:#666">${item.address}</span>
                </div>
            `;
        });
    }


    function copyList() {
        if(pickupQueue.length === 0) return alert("Pilih customer dulu!");
        let text = "*LIST PICKUP ANTARBULU*\nTanggal: " + new Date().toLocaleDateString('id-ID') + "\n----------------------------\n\n";
        pickupQueue.forEach((item, i) => {
            text += `${i+1}. *${item.name}*\n📍 Area: ${item.area}\n🏠 Alamat: ${item.address}\n🗺️ Maps: ${item.maps}\n\n`;
        });
        text += "----------------------------\nMohon dikerjakan dengan hati-hati.";


        navigator.clipboard.writeText(text).then(() => {
            alert("List berhasil disalin! Silakan paste ke WhatsApp.");
        });
    }


    renderDatabase(clients);
</script>
